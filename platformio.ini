; Xavier · 沈星回智能气味挂件 —— PlatformIO 工程
; 源码就在仓库根目录（xavier_pendant.ino + config.h），同一份代码也能用 Arduino IDE 打开。
; 用法：pio run -t upload && pio device monitor

[platformio]
src_dir = .

[env:esp32c3_supermini]
; 推荐 pioarduino 平台以获得 Arduino-ESP32 核心 3.x（与 Arduino CLI 编译验证的版本一致）
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
